    sizing: "4 GB of memory per server"
  pt:
    name: "Espaço de equipa"
    summary: "Ficheiros e agendas partilhados, conversa de equipa, palavras-passe comuns e documentação, em três servidores para ficar online durante uma avaria ou uma atualização."
    sizing: "4 GB de memória por servidor"
  it:
    name: "Spazio di squadra"
    summary: "File e calendari condivisi, chat di squadra, password comuni e documentazione, su tre server per restare online durante un guasto o un aggiornamento."
    sizing: "4 GB di memoria per server"
  de:
    name: "Team-Arbeitsbereich"
    summary: "Geteilte Dateien und Kalender, Team-Chat, gemeinsame Passwörter und Dokumentation, auf drei Servern, um bei einem Ausfall oder Update online zu bleiben."
    sizing: "4 GB Arbeitsspeicher pro Server"
cluster: equipe
servers:
