type: myinfra-library-template
version: 1
name: "Espace d'équipe"
summary: "Fichiers et agendas partagés, messagerie d'équipe, mots de passe communs et documentation, sur trois serveurs pour rester en ligne pendant une panne ou une mise à jour."
sizing: "4 Go de mémoire par serveur"
translations:
  en:
    name: "Team workspace"
